<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AP Psychology Revision Activities</title>
<style>
  :root{--ink:#2E3A46;--ink-soft:#56657A;--dusty:#5F7F9E;--dusty-dark:#3F5E7D;--cloud:#F7F6F2;--sand:#EDE3CF;--mist:#E3EAF1;--mist-dark:#B9C8D8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cloud);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:17px;line-height:1.5}
  header{background:#fff;border-bottom:2px solid var(--mist-dark);padding:22px 20px;
    background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--mist) 31px 32px)}
  .wrap{max-width:820px;margin:0 auto}
  h1{margin:0 0 4px;color:var(--dusty-dark);font-size:30px}
  .lead{margin:0;color:var(--ink-soft)}
  main{padding:22px 16px 50px}
  .grid{display:grid;gap:16px}
  a.card{display:block;background:#fff;border:1px solid var(--mist-dark);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink)}
  a.card:hover{border-color:var(--dusty);box-shadow:0 4px 14px rgba(63,94,125,.12)}
  .card h2{margin:0 0 6px;color:var(--dusty-dark);font-size:22px}
  .card p{margin:0;color:var(--ink-soft)}
  .tag{display:inline-block;background:var(--sand);border-radius:999px;padding:2px 10px;font-size:14px;margin-bottom:8px;color:var(--ink)}
  .back{display:inline-block;margin-top:14px;background:var(--dusty);color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:bold}
  .back:hover{background:var(--dusty-dark)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>AP Psychology Revision Activities</h1>
    <p class="lead">Songs, clips, and challenges for revising in class.</p>
    <a class="back" href="https://psych4everybody.github.io/psych-revision/">&larr; Back to Revision Home</a>
  </div>
</header>
<main class="wrap">
  <div class="grid">
    <a class="card" href="unit2-media-revision.html">
      <span class="tag">Units 1.6 and 2</span>
      <h2>Unit 2 Media Revision: Match the Term</h2>
      <p>Two revision songs, the Memento trailer, a perception illusion, and the Eyewitness Challenge.</p>
    </a>
  </div>
</main>
</body>
</html>
